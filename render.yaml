services:
  # ===================================================
  # Backend Web Service (FastAPI + YOLO Inference API)
  # ===================================================
  - type: web
    name: omnidetect-ai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 300
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: .
      - key: MODEL_PATH
        value: yolov8n.pt
      - key: CORS_ORIGINS
        value: "*"
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: INPUT_SIZE
        value: "640"
      - key: USE_HALF
        value: "false"

  # ===================================================
  # Frontend Static Site (React + Vite Dashboard)
  # ===================================================
  - type: static
    name: omnidetect-ai-frontend
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: VITE_API_URL
        sync: false
